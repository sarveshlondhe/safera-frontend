<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF3B30" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Safera" />
    <link rel="apple-touch-icon" href="/safera_192x192.png" />

    <!-- App info -->
    <meta name="description" content="AISSMS Campus Disaster Intelligence System" />

    <link rel="icon" type="image/png" href="/safera_192x192.png" />
    <title>Safera — Campus Safety</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Safera SW registered ✅'))
            .catch((e) => console.log('SW error:', e));
        });
      }
    </script>
  </body>
</html>
